[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "permisapi-mcp"
version = "0.5.4"
description = "Serveur MCP pour PermisAPI : 14 outils pour consulter 1,2 M+ permis de construire de France (2014-2026) depuis Claude Desktop, Cursor, Windsurf et tout client MCP-compatible. v0.5.4 ajoute le tool get_commune_density_stats (stats macro densité urbaine par commune : parcelles + bâtiments + permits + distribution Score MDB, plan Business+) pour le sprint 10 cadastre Prio 7."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Evan Caroux", email = "evan@permisapi.fr" },
]
keywords = ["permis", "construire", "france", "mcp", "claude", "chatgpt", "anthropic", "real-estate", "sitadel"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Natural Language :: French",
]
dependencies = [
    "mcp>=1.0.0",
    "permisapi-client>=0.7.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]
sse = [
    "starlette>=0.40",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
permisapi-mcp = "permisapi_mcp.server:main"
permisapi-mcp-sse = "permisapi_mcp.sse_server:main"

[project.urls]
Homepage = "https://permisapi.fr/mcp"
Documentation = "https://permisapi.fr/mcp"
Setup = "https://github.com/Evan-Crx/permisapi-mcp/blob/main/README.md"
Source = "https://github.com/Evan-Crx/permisapi-mcp"
Issues = "https://github.com/Evan-Crx/permisapi-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["permisapi_mcp"]
